name: Build and publish container image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify model files are real (not LFS pointers)
        run: |
          for f in models/ticket_model.joblib models/encoder_ft_delta.safetensors; do
            size=$(stat -c%s "$f"); echo "$f: $size bytes"
            [ "$size" -gt 1000000 ] || { echo "$f looks like an LFS pointer"; exit 1; }
          done

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image offline
        run: |
          docker run -d --name svc --network none -e API_KEY=ci-test-key "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 60); do
            if docker exec svc python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)" 2>/dev/null; then
              echo "healthy after ${i}s"; break
            fi
            sleep 2
          done
          docker exec svc python -c "
          import json, urllib.request
          req = urllib.request.Request('http://127.0.0.1:8000/predict', method='POST',
              data=json.dumps({'channel': 'chat', 'text': 'my order is late, please refund'}).encode(),
              headers={'Content-Type': 'application/json', 'X-API-Key': 'ci-test-key'})
          print(json.loads(urllib.request.urlopen(req).read()))
          "
          docker logs svc | tail -20
